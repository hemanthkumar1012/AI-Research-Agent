<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e1a"/><stop offset="0.55" stop-color="#101833"/><stop offset="1" stop-color="#1a1240"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ea8ff"/><stop offset="1" stop-color="#c08cff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c6cff" stop-opacity="0.55"/><stop offset="1" stop-color="#7c6cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="node" cx="0.35" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.35" stop-color="#9cc2ff"/><stop offset="1" stop-color="#5b5bd6"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="24" fill="url(#grid)"/>
  <circle cx="1010" cy="200" r="230" fill="url(#glow)"/>

  <!-- knowledge graph -->
  <g stroke="url(#acc)" stroke-width="1.6" stroke-opacity="0.55" fill="none">
    <path d="M1010 200 L880 110 M1010 200 L1140 95 M1010 200 L1165 255 M1010 200 L905 300 M1010 200 L1030 335 M1010 200 L1010 65"/>
    <path d="M880 110 L1010 65 L1140 95 L1165 255 L1030 335 L905 300 Z" stroke-opacity="0.25" stroke-dasharray="4 6"/>
    <path d="M880 110 L800 170 M905 300 L810 255 M1140 95 L1225 150 M1165 255 L1235 310" stroke-opacity="0.3"/>
  </g>
  <g>
    <circle cx="1010" cy="200" r="38" fill="#0c1124" stroke="url(#acc)" stroke-width="2.5"/>
    <circle cx="1010" cy="200" r="46" fill="none" stroke="#8fa8ff" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="3 5"/>
    <!-- magnifier icon -->
    <circle cx="1004" cy="194" r="13" fill="none" stroke="#e8ecff" stroke-width="3.5"/>
    <path d="M1014 204 L1026 216" stroke="#e8ecff" stroke-width="4.5" stroke-linecap="round"/>
  </g>
  <g fill="url(#node)">
    <circle cx="880" cy="110" r="11"/><circle cx="1140" cy="95" r="13"/><circle cx="1165" cy="255" r="10"/>
    <circle cx="905" cy="300" r="12"/><circle cx="1030" cy="335" r="8"/><circle cx="1010" cy="65" r="9"/>
  </g>
  <g fill="#9cb4ff" fill-opacity="0.5"><circle cx="800" cy="170" r="5"/><circle cx="810" cy="255" r="4"/><circle cx="1225" cy="150" r="5"/><circle cx="1235" cy="310" r="4"/></g>
  <!-- node labels -->
  <g font-size="12" fill="#c9d4ff" fill-opacity="0.85" font-weight="600">
    <text x="842" y="92">arXiv</text><text x="1152" y="80">Web</text><text x="1180" y="259">Wikipedia</text>
    <text x="848" y="327">Your PDFs</text><text x="1044" y="352">Gemini</text><text x="1024" y="52">Plan</text>
  </g>
  <!-- verified badge -->
  <g transform="translate(1110 165)">
    <rect x="0" y="0" width="118" height="30" rx="15" fill="#0f2a22" stroke="#4cc38a" stroke-opacity="0.8"/>
    <path d="M14 15 l5 5 l10 -11" fill="none" stroke="#4cc38a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="36" y="20" font-size="12.5" fill="#8ff0bd" font-weight="700">verified [3]</text>
  </g>

  <!-- title block -->
  <text x="72" y="118" font-size="15" letter-spacing="3" fill="#8fa8ff" font-weight="700">AUTONOMOUS · SELF-VERIFYING · GEMINI</text>
  <text x="70" y="182" font-size="62" font-weight="800" fill="#f2f5ff">AI Research Agent</text>
  <rect x="72" y="200" width="150" height="5" rx="2.5" fill="url(#acc)"/>
  <text x="72" y="244" font-size="20" fill="#b8c2dc">Plans, searches web · arXiv · Wikipedia, reads full papers,</text>
  <text x="72" y="272" font-size="20" fill="#b8c2dc">writes a cited report — then fact-checks and fixes itself.</text>

  <g font-size="14" font-weight="600">
    <g transform="translate(72 308)"><rect width="184" height="36" rx="18" fill="#16203b" stroke="#2c3a63"/><circle cx="20" cy="18" r="5" fill="#4cc38a"/><text x="34" y="23" fill="#dfe6ff">Citation verification</text></g>
    <g transform="translate(268 308)"><rect width="150" height="36" rx="18" fill="#16203b" stroke="#2c3a63"/><circle cx="20" cy="18" r="5" fill="#c08cff"/><text x="34" y="23" fill="#dfe6ff">Self-correction</text></g>
    <g transform="translate(430 308)"><rect width="160" height="36" rx="18" fill="#16203b" stroke="#2c3a63"/><circle cx="20" cy="18" r="5" fill="#6ea8ff"/><text x="34" y="23" fill="#dfe6ff">Hybrid retrieval</text></g>
    <g transform="translate(602 308)"><rect width="150" height="36" rx="18" fill="#16203b" stroke="#2c3a63"/><circle cx="20" cy="18" r="5" fill="#e5b454"/><text x="34" y="23" fill="#dfe6ff">Conflict finder</text></g>
  </g>
</svg>
