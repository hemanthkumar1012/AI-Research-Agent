<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="630" viewBox="0 0 1280 630" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0e1a"/><stop offset="1" stop-color="#0f1f24"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity="0.03"/></pattern>
<linearGradient id="gb" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#2f8f65"/><stop offset="1" stop-color="#5fe0a3"/></linearGradient>
<linearGradient id="ab" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#8a6a2a"/><stop offset="1" stop-color="#e5b454"/></linearGradient>
<marker id="arg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4cc38a"/></marker>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity="0.5"/></filter>
</defs>
<rect width="1280" height="630" rx="24" fill="url(#bg)"/><rect width="1280" height="630" rx="24" fill="url(#grid)"/>
<text x="60" y="64" font-size="30" font-weight="800" fill="#f2f5ff">Claim-level verification &amp; self-correction</text>
<text x="60" y="94" font-size="16" fill="#8f9ab8">Every cited sentence is checked against the exact passages it cites, then flagged claims are rewritten.</text>
<g filter="url(#sh)"><rect x="60" y="130" width="700" height="456" rx="18" fill="#121a2b" stroke="#2a3557"/></g>
<circle cx="84" cy="154" r="5" fill="#ef6b6b"/><circle cx="102" cy="154" r="5" fill="#e5b454"/><circle cx="120" cy="154" r="5" fill="#4cc38a"/>
<text x="144" y="159" font-size="12.5" fill="#6f7a99">report.md · draft 1</text>
<text x="88" y="202" font-size="19" font-weight="800" fill="#eef2ff">## Summary</text>
<rect x="84" y="230" width="652" height="78" rx="12" fill="#4cc38a" fill-opacity="0.07" stroke="#4cc38a" stroke-opacity="0.45"/>
<rect x="84" y="230" width="4" height="78" rx="2" fill="#4cc38a"/>
<text x="104" y="258" font-size="15" fill="#dfe6ff">Solid-state cells replace liquid electrolyte</text>
<text x="104" y="280" font-size="15" fill="#dfe6ff">with a solid ceramic or polymer layer [1][3].</text>
<rect x="614" y="242" width="98" height="24" rx="12" fill="#4cc38a" fill-opacity="0.18"/>
<text x="663.0" y="258.5" text-anchor="middle" font-size="12" font-weight="800" fill="#4cc38a">SUPPORTED</text>
<text x="104" y="300" font-size="12" fill="#8f9ab8" font-style="italic">verifier: passage [1] states this directly</text>
<rect x="84" y="316" width="652" height="78" rx="12" fill="#e5b454" fill-opacity="0.07" stroke="#e5b454" stroke-opacity="0.45"/>
<rect x="84" y="316" width="4" height="78" rx="2" fill="#e5b454"/>
<text x="104" y="344" font-size="15" fill="#dfe6ff">Energy density is roughly double today's</text>
<text x="104" y="366" font-size="15" fill="#dfe6ff">lithium-ion packs [2].</text>
<rect x="630" y="328" width="82" height="24" rx="12" fill="#e5b454" fill-opacity="0.18"/>
<text x="671.0" y="344.5" text-anchor="middle" font-size="12" font-weight="800" fill="#e5b454">PARTIAL</text>
<text x="104" y="386" font-size="12" fill="#8f9ab8" font-style="italic">verifier: source says “up to 50% higher”</text>
<rect x="84" y="402" width="652" height="78" rx="12" fill="#ef6b6b" fill-opacity="0.07" stroke="#ef6b6b" stroke-opacity="0.45"/>
<rect x="84" y="402" width="4" height="78" rx="2" fill="#ef6b6b"/>
<text x="104" y="430" font-size="15" fill="#dfe6ff">Mass-market EVs will ship with them</text>
<text x="104" y="452" font-size="15" fill="#dfe6ff">by 2025 [4].</text>
<rect x="598" y="414" width="114" height="24" rx="12" fill="#ef6b6b" fill-opacity="0.18"/>
<text x="655.0" y="430.5" text-anchor="middle" font-size="12" font-weight="800" fill="#ef6b6b">UNSUPPORTED</text>
<text x="104" y="472" font-size="12" fill="#8f9ab8" font-style="italic">verifier: [4] gives no date for mass market</text>
<rect x="84" y="488" width="652" height="78" rx="12" fill="#4cc38a" fill-opacity="0.07" stroke="#4cc38a" stroke-opacity="0.45"/>
<rect x="84" y="488" width="4" height="78" rx="2" fill="#4cc38a"/>
<text x="104" y="516" font-size="15" fill="#dfe6ff">Dendrite growth at the lithium anode remains</text>
<text x="104" y="538" font-size="15" fill="#dfe6ff">the main durability challenge [1][5].</text>
<rect x="614" y="500" width="98" height="24" rx="12" fill="#4cc38a" fill-opacity="0.18"/>
<text x="663.0" y="516.5" text-anchor="middle" font-size="12" font-weight="800" fill="#4cc38a">SUPPORTED</text>
<text x="104" y="558" font-size="12" fill="#8f9ab8" font-style="italic">verifier: both passages agree</text>
<path d="M780 350 H 838" stroke="#4cc38a" stroke-width="3" marker-end="url(#arg)"/>
<text x="809" y="334" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8ff0bd">revise</text>
<g filter="url(#sh)"><rect x="860" y="130" width="360" height="456" rx="18" fill="#121a2b" stroke="#2a3557"/></g>
<text x="888" y="174" font-size="13" letter-spacing="2" font-weight="700" fill="#8f9ab8">CITATION PRECISION</text>
<text x="888" y="196" font-size="12" fill="#6f7a99">(supported + ½ partial) / claims</text>
<rect x="920" y="260" width="90" height="230" rx="10" fill="#ffffff" fill-opacity="0.03"/>
<rect x="920" y="346.25" width="90" height="143.75" rx="10" fill="url(#ab)"/>
<text x="965" y="334.25" text-anchor="middle" font-size="24" font-weight="800" fill="#f2f5ff">62%</text>
<text x="965" y="516" text-anchor="middle" font-size="15" font-weight="700" fill="#dfe6ff">Draft</text>
<text x="965" y="536" text-anchor="middle" font-size="11.5" fill="#8f9ab8">1 partial · 1 unsupported</text>
<rect x="1060" y="260" width="90" height="230" rx="10" fill="#ffffff" fill-opacity="0.03"/>
<rect x="1060" y="260.0" width="90" height="230.0" rx="10" fill="url(#gb)"/>
<text x="1105" y="248.0" text-anchor="middle" font-size="24" font-weight="800" fill="#f2f5ff">100%</text>
<text x="1105" y="516" text-anchor="middle" font-size="15" font-weight="700" fill="#dfe6ff">Final</text>
<text x="1105" y="536" text-anchor="middle" font-size="11.5" fill="#8f9ab8">0 flagged</text>
<text x="1040.0" y="572" text-anchor="middle" font-size="11.5" fill="#6f7a99">Illustrative example · run the eval for your numbers</text>
</svg>