[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "research-agent"
version = "0.5.0"
description = "AI-powered research agent: plan → search → read → verify → write cited reports"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "V. Hemanth Kumar" }]
keywords = ["research", "agent", "gemini", "ai", "citations"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["requests>=2.28", "beautifulsoup4>=4.11"]

[project.optional-dependencies]
pdf = ["pypdf>=3.0"]

[project.scripts]
research-agent = "research_agent.cli:main"
research-agent-server = "research_agent.server:main"

[project.urls]
Repository = "https://github.com/hemanthkumar1012/AI-Research-Agent"

[tool.setuptools.packages.find]
include = ["research_agent*"]

[tool.setuptools.package-data]
research_agent = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
