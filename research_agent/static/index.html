<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Research Agent</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root{--bg:#0d1017;--panel:#151a24;--line:#232b3a;--text:#e6e9ef;--dim:#8a93a6;--acc:#7aa2ff;--ok:#4cc38a;--warn:#e5b454;--bad:#ef6b6b}
  *{box-sizing:border-box}body{margin:0;font:15px/1.6 system-ui,sans-serif;background:var(--bg);color:var(--text)}
  a{color:var(--acc)}
  .wrap{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
  @media(max-width:960px){.wrap{grid-template-columns:1fr}aside{display:none}}
  aside{border-right:1px solid var(--line);padding:20px 14px;background:#0f131c}
  aside h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);margin:0 0 8px}
  .hist{display:block;padding:8px;border-radius:8px;color:var(--text);text-decoration:none;font-size:13px;cursor:pointer}
  .hist:hover{background:var(--panel)} .hist small{color:var(--dim);display:block}
  header{padding:24px 24px 4px}h1{margin:0;font-size:22px}header p{margin:4px 0 0;color:var(--dim)}
  form.q{display:flex;gap:8px;margin:14px 24px}
  input,select{padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:15px}
  input{flex:1}button{padding:12px 18px;border:0;border-radius:10px;background:var(--acc);color:#0b1020;font-weight:600;cursor:pointer}button:disabled{opacity:.5}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--text);padding:6px 12px;font-weight:500}
  main{display:grid;grid-template-columns:330px 1fr;gap:16px;padding:0 24px 40px}
  @media(max-width:1200px){main{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
  .card > h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
  #log{max-height:70vh;overflow:auto}#log div{padding:4px 0;border-bottom:1px dashed var(--line);font-size:13.5px;word-break:break-word}
  .score{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
  .pill{padding:4px 10px;border-radius:99px;font-size:13px;background:#1d2433}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
  .tag{font-size:11px;padding:1px 6px;border-radius:6px;margin-left:4px;background:#1d2433;color:var(--dim)}
  .tag.high{color:var(--ok)}.tag.low{color:var(--bad)}.tag.medium{color:var(--warn)}
  .usage{color:var(--dim);font-size:12.5px;margin-bottom:8px}
  #report h2{border-bottom:1px solid var(--line);padding-bottom:4px}.empty{color:var(--dim)}
  .conflict{border-left:3px solid var(--warn);padding:6px 10px;margin:8px 0;background:#1a1f2b;border-radius:0 8px 8px 0;font-size:14px}
  .conflict ul{margin:4px 0;padding-left:18px}.conflict em{color:var(--dim)}
  .msg{padding:10px 12px;border-radius:10px;margin:8px 0;font-size:14.5px}.msg.user{background:#1d2433}.msg.bot{border:1px solid var(--line)}
  .msg p{margin:4px 0}#chatform{display:flex;gap:8px;margin-top:8px}
  .hidden{display:none}
  .ghostbtn{display:flex;align-items:center;padding:0 14px;border:1px solid var(--line);border-radius:10px;cursor:pointer;font-size:18px;background:var(--panel)}
  .tag.user{color:var(--acc)}
  .tabs{display:flex;gap:6px}.tab{background:transparent;border:1px solid var(--line);color:var(--dim);padding:5px 12px;border-radius:8px;font-size:12px;font-weight:600;text-transform:none;letter-spacing:0}
  .tab.on{color:var(--text);border-color:var(--acc);background:#1a2340}
  .live{white-space:pre-wrap;font-size:14.5px;color:#cfd6ea}.cursor{display:inline-block;width:8px;height:16px;background:var(--acc);vertical-align:-2px;animation:b 1s steps(1) infinite}@keyframes b{50%{opacity:0}}
  #graph svg{width:100%;height:auto}#graph .n{cursor:pointer}#graph .n:hover rect,#graph .n.sel rect{stroke:#fff;stroke-width:1.6}
  #graph .e{stroke-opacity:.35;fill:none}#graph .e.hl{stroke-opacity:1;stroke-width:2.4}
  .detail{margin-top:12px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#111726;font-size:14px}
  .fact{display:flex;gap:8px;padding:6px 0;border-top:1px dashed var(--line)}.fact:first-of-type{border-top:0}
  .quote{color:var(--dim);font-style:italic;font-size:13px;display:block;margin-top:2px}
</style>
</head>
<body>
<div class="wrap">
<aside><h3>Recent reports</h3><div id="history" class="empty" style="font-size:13px">None yet.</div></aside>
<div>
<header><h1>🔬 AI Research Agent</h1><p>Plans, searches web · arXiv · Wikipedia, cross-checks sources, writes a cited report, fact-checks and self-corrects it.</p></header>
<form class="q" id="f">
  <input id="q" placeholder="Ask a research question…" required>
  <select id="depth" title="Research depth"><option value="quick">Quick</option><option value="standard" selected>Standard</option><option value="deep">Deep</option></select>
  <label class="ghostbtn" title="Add your own PDFs or documents as sources">📎<input type="file" id="files" multiple accept=".pdf,.txt,.md,.html" hidden></label>
  <button id="b">Research</button>
</form>
<div id="filelist" class="usage" style="margin:-6px 24px 8px"></div>
<main>
  <section><div class="card"><h2>Agent trace</h2><div id="log" class="empty">Steps will stream here.</div></div></section>
  <section>
    <div class="card"><h2>Report <span class="tabs"><button class="tab on" data-t="report">Report</button><button class="tab" data-t="graph">Citation graph</button><button class="ghost hidden" id="dl">Download .md</button></span></h2>
      <div id="score"></div><div id="report" class="empty">Your report will appear here.</div>
      <div id="graph" class="hidden"></div></div>
    <div class="card hidden" id="conflictCard"><h2>⚖️ Where sources disagree</h2><div id="conflicts"></div></div>
    <div class="card hidden" id="chatCard"><h2>💬 Ask follow-up questions</h2>
      <div id="chat"></div>
      <form id="chatform"><input id="cq" placeholder="e.g. Which source is most reliable on this?" required><button id="cb">Ask</button></form>
    </div>
  </section>
</main>
</div></div>
<script>
const $=id=>document.getElementById(id), log=$('log');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct=x=>Math.round((x||0)*100)+'%';
function miniMd(src){const out=[];let list=false;
  const inline=t=>{const links=[];
    t=t.replace(/\[([^\]]+)\]\((https?:[^)\s]+|file:[^)\s]+)\)/g,(_,txt,url)=>{links.push(`<a href="${esc(url)}">${esc(txt)}</a>`);return `\u0000${links.length-1}\u0000`});
    return esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>').replace(/(^|\s)_(.+?)_(?=\s|$)/g,'$1<i>$2</i>')
      .replace(/\u0000(\d+)\u0000/g,(_,i)=>links[+i])};
  for(const line of (src||'').split('\n')){const m=line.match(/^(#{1,4})\s+(.*)/), li=line.match(/^\s*(?:[-*]|\d+\.)\s+(.*)/);
    if(!li&&list){out.push('</ul>');list=false}
    if(m)out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`);
    else if(li){if(!list){out.push('<ul>');list=true}out.push(`<li>${inline(li[1])}</li>`)}
    else if(line.trim())out.push(`<p>${inline(line)}</p>`)}
  if(list)out.push('</ul>');return out.join('')}
const md=s=>{const d=document.createElement('div');d.innerHTML=window.marked?marked.parse(s||''):miniMd(s);d.querySelectorAll('a').forEach(a=>{a.target='_blank';a.rel='noopener'});return d.innerHTML};
let current=null, chatHistory=[], uploads=[], liveText='';
const CRED={user:'#7aa2ff',high:'#4cc38a',medium:'#e5b454',low:'#ef6b6b'}, LAB={supported:'#4cc38a',partial:'#e5b454',unsupported:'#ef6b6b',unchecked:'#8a93a6'};
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));
  $('report').classList.toggle('hidden',t.dataset.t!=='report');$('graph').classList.toggle('hidden',t.dataset.t!=='graph');
  if(t.dataset.t==='graph'&&current)drawGraph(current)});
function drawGraph(d){
  const S=d.sources, C=d.claims, W=860, rowS=Math.max(34,Math.min(56,520/Math.max(S.length,1))), rowC=30;
  const H=Math.max(S.length*rowS, C.length*rowC)+40, sx=20, sw=300, cx=W-400, cw=380;
  const sy=i=>20+i*((H-40)/Math.max(S.length,1))+8, cy=i=>20+i*((H-40)/Math.max(C.length,1))+4;
  const idx=Object.fromEntries(S.map((s,i)=>[s.id,i]));
  let e='',n='';
  C.forEach((c,j)=>c.cites.forEach(id=>{if(idx[id]===undefined)return;const y1=sy(idx[id])+13,y2=cy(j)+11;
    e+=`<path class="e" data-s="${id}" data-c="${c.id}" d="M${sx+sw} ${y1} C ${sx+sw+120} ${y1}, ${cx-120} ${y2}, ${cx} ${y2}" stroke="${LAB[c.label]||'#8a93a6'}"/>`}));
  S.forEach((s,i)=>{const t=esc(s.title.length>38?s.title.slice(0,36)+'…':s.title);
    n+=`<g class="n" data-s="${s.id}"><rect x="${sx}" y="${sy(i)}" width="${sw}" height="26" rx="7" fill="#151c2e" stroke="${CRED[s.credibility]||'#555'}"/><circle cx="${sx+14}" cy="${sy(i)+13}" r="4.5" fill="${CRED[s.credibility]||'#555'}"/><text x="${sx+26}" y="${sy(i)+17.5}" font-size="12.5" fill="#dfe6ff">[${s.id}] ${t}</text></g>`});
  C.forEach((c,j)=>{const t=esc(c.text.length>52?c.text.slice(0,50)+'…':c.text);
    n+=`<g class="n" data-c="${c.id}"><rect x="${cx}" y="${cy(j)}" width="${cw}" height="22" rx="6" fill="#151c2e" stroke="${LAB[c.label]}"/><text x="${cx+10}" y="${cy(j)+15}" font-size="11.5" fill="#cfd6ea">${t}</text></g>`});
  $('graph').innerHTML=`<div class="usage">Sources (left, coloured by credibility) → claims (right, coloured by verdict). Click a node.</div><svg viewBox="0 0 ${W} ${H}" font-family="system-ui,sans-serif">${e}${n}</svg><div id="gdetail"></div>`;
  $('graph').querySelectorAll('.n').forEach(g=>g.onclick=()=>{
    $('graph').querySelectorAll('.n').forEach(x=>x.classList.remove('sel'));g.classList.add('sel');
    const sid=g.dataset.s, cid=g.dataset.c;
    $('graph').querySelectorAll('.e').forEach(p=>p.classList.toggle('hl',(sid&&p.dataset.s===sid)||(cid&&p.dataset.c===cid)));
    if(cid){const c=C.find(x=>String(x.id)===cid);
      $('gdetail').innerHTML=`<div class="detail"><span class="tag" style="color:${LAB[c.label]}">${c.label}</span> ${esc(c.text)}<div class="usage">${esc(c.reason||'')} · cites ${c.cites.map(x=>'['+x+']').join('')}</div>`+
        (c.facts||[]).map(f=>`<div class="fact"><span style="color:${f.supported?'#4cc38a':'#ef6b6b'}">${f.supported?'✔':'✖'}</span><div>${esc(f.fact)}${f.quote?`<span class="quote">“${esc(f.quote)}”${f.source?' — ['+f.source+']':''}</span>`:''}</div></div>`).join('')+'</div>';}
    else{const s=S.find(x=>String(x.id)===sid), used=C.filter(c=>c.cites.includes(+sid));
      $('gdetail').innerHTML=`<div class="detail"><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a> <span class="tag ${esc(s.credibility)}">${esc(s.credibility)}</span>${s.date?` <span class="tag">${esc(s.date)}</span>`:''}<div class="usage">Cited by ${used.length} claim(s): ${used.filter(c=>c.label==='supported').length} supported</div></div>`}
  });
}
$('files').onchange=async()=>{
  for(const f of $('files').files){
    $('filelist').textContent=`Uploading ${f.name}…`;
    const r=await (await fetch('/api/upload',{method:'POST',headers:{'X-Filename':f.name},body:f})).json();
    if(r.token)uploads.push(r);else alert(r.error);
  }
  $('files').value='';
  $('filelist').innerHTML=uploads.length?'📎 Your sources: '+uploads.map(u=>esc(u.name)).join(', ')+' <a href="#" id="clearf">clear</a>':'';
  if($('clearf'))$('clearf').onclick=e=>{e.preventDefault();uploads=[];$('filelist').innerHTML=''};
};
function add(html){if(log.classList.contains('empty')){log.innerHTML='';log.classList.remove('empty')}
  const d=document.createElement('div');d.innerHTML=html;log.appendChild(d);log.scrollTop=log.scrollHeight}

function show(d){
  current=d;chatHistory=[];$('chat').innerHTML='';
  const s=d.score, h=d.history||[], u=d.usage||{};
  $('score').innerHTML=`<div class="score"><span class="pill">Precision <b>${pct(s.citation_precision)}</b></span>
    <span class="pill ok">${s.supported} supported</span><span class="pill warn">${s.partial} partial</span><span class="pill bad">${s.unsupported} unsupported</span>
    ${h.length>1?`<span class="pill">Draft ${pct(h[0].citation_precision)} → final ${pct(s.citation_precision)}</span>`:''}
    ${s.fact_precision!=null?`<span class="pill">Atomic facts <b>${pct(s.fact_precision)}</b> of ${s.facts}</span>`:''}
    <span class="pill">${d.sources.length} sources</span>${d.time_sensitive?'<span class="pill warn">time-sensitive</span>':''}</div>
    ${u.calls!==undefined?`<div class="usage">${u.calls} LLM calls · ${u.cached} cached · ${(u.input_tokens+u.output_tokens).toLocaleString()} tokens</div>`:''}`;
  $('report').classList.remove('empty');$('report').innerHTML=md(d.markdown);
  const c=d.conflicts||[];$('conflictCard').classList.toggle('hidden',!c.length);
  $('conflicts').innerHTML=c.map(x=>`<div class="conflict"><b>${esc(x.topic)}</b><ul>${x.positions.map(p=>`<li>[${p.source}] ${esc(p.says)}</li>`).join('')}</ul>${x.assessment?`<em>${esc(x.assessment)}</em>`:''}</div>`).join('');
  $('chatCard').classList.toggle('hidden',!d.id);$('dl').classList.remove('hidden');
  if(!$('graph').classList.contains('hidden'))drawGraph(d);
}
async function loadHistory(){
  try{const items=await (await fetch('/api/history')).json();
    if(!items.length)return;$('history').classList.remove('empty');
    $('history').innerHTML=items.map(i=>`<a class="hist" data-id="${esc(i.id)}">${esc(i.question)}<small>${i.precision!=null?pct(i.precision)+' precision':''}</small></a>`).join('');
    document.querySelectorAll('.hist').forEach(a=>a.onclick=async()=>{
      const d=await (await fetch('/api/report?id='+encodeURIComponent(a.dataset.id))).json();
      log.innerHTML='<div>Loaded saved report.</div>';$('q').value=d.question;show(d)});
  }catch(e){}
}
$('f').onsubmit=e=>{
  e.preventDefault();$('b').disabled=true;log.innerHTML='';$('score').innerHTML='';
  ['conflictCard','chatCard','dl'].forEach(i=>$(i).classList.add('hidden'));
  $('report').innerHTML='<span class="empty">Researching…</span>';
  const es=new EventSource(`/api/research?depth=${$('depth').value}&files=${encodeURIComponent(uploads.map(u=>u.token).join(','))}&q=`+encodeURIComponent($('q').value));
  const on=(k,f)=>es.addEventListener(k,ev=>f(JSON.parse(ev.data)));
  on('status',d=>add('• '+esc(d.message)));
  on('plan',d=>add('🧭 <b>Plan</b>'+(d.time_sensitive?' <span class="tag medium">time-sensitive</span>':'')+'<br>'+d.subquestions.map(s=>`– ${esc(s.question)} <span class="tag">${esc(s.source)}</span>`).join('<br>')));
  on('search',d=>add(`🔎 ${esc(d.query)} <span class="tag">${esc(d.kind)}</span>`));
  on('source',d=>add(`📄 [${d.id}] <a href="${esc(d.url)}" target="_blank" rel="noopener">${esc(d.title)}</a><span class="tag ${esc(d.credibility)}">${esc(d.credibility)}</span>${d.date?`<span class="tag">${esc(d.date)}</span>`:''}`));
  on('writing',d=>{liveText='';add(d.phase==='draft'?'📝 Drafting report (live)…':'📝 Streaming revision…');
    $('report').classList.remove('empty');$('report').innerHTML='<div class="live"></div>'});
  on('token',d=>{liveText+=d.text;const el=$('report').querySelector('.live');if(el)el.innerHTML=esc(liveText)+'<span class="cursor"></span>'});
  on('budget',d=>add(`💸 ${esc(d.message)} (${d.used.toLocaleString()}/${d.limit.toLocaleString()} tokens)`));
  on('gaps',d=>add('🕳️ Filling gaps: '+d.queries.map(esc).join('; ')));
  on('conflicts',d=>add('⚖️ Sources disagree on: '+d.conflicts.map(c=>esc(c.topic)).join('; ')));
  on('verify',d=>add(`✅ Checked ${d.checked}/${d.total} claims`));
  on('revise',d=>add(`✍️ Self-correcting ${d.flagged} flagged claims (round ${d.round})`));
  on('report',d=>{show(d);done();loadHistory()});
  on('error',d=>{add('<span class="bad">✖ '+esc(d.message)+'</span>');$('report').innerHTML='';done()});
  es.onerror=()=>done();
  function done(){es.close();$('b').disabled=false}
};
$('chatform').onsubmit=async e=>{
  e.preventDefault();if(!current)return;const q=$('cq').value.trim();if(!q)return;
  $('cq').value='';$('cb').disabled=true;
  $('chat').insertAdjacentHTML('beforeend',`<div class="msg user">${esc(q)}</div><div class="msg bot empty" id="pending">Thinking…</div>`);
  try{
    const r=await (await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({id:current.id,question:q,history:chatHistory})})).json();
    const p=$('pending');p.removeAttribute('id');p.classList.remove('empty');
    p.innerHTML=r.error?`<span class="bad">${esc(r.error)}</span>`:md(r.answer)+`<div class="usage">citation precision ${pct(r.score.citation_precision)}</div>`;
    if(!r.error)chatHistory.push({role:'user',content:q},{role:'assistant',content:r.answer});
  }catch(err){$('pending').textContent='Request failed'}
  $('cb').disabled=false;
};
$('dl').onclick=()=>{if(!current)return;const b=new Blob([`# ${current.question}\n\n${current.markdown}\n`],{type:'text/markdown'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=(current.id||'report')+'.md';a.click()};
loadHistory();
</script>
</body>
</html>
